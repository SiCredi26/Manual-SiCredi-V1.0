<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiCredi Web — Simulador Avanzado (Fase 2)</title>
    <style>
        body { font-family: 'Inter', Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h1 { color: #1e3a1e; font-size: 1.4rem; border-bottom: 2px solid #84cc16; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; color: #4b5563; }
        input, select { padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
        button { background-color: #16a34a; color: white; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; }
        button:hover { background-color: #15803d; }
        .box { margin-top: 20px; background: #f9fafb; border: 1px solid #e5e7eb; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.8rem; }
        th, td { border: 1px solid #d1d5db; padding: 6px; text-align: left; }
        th { background-color: #e5e7eb; }
    </style>
</head>
<body>

<div class="container">
    <h1>🌱 SiCredi Fase 2 — Simulador Financiero y Agrícola Avanzado</h1>
    <h2>Aplica IVA cuando no hay RFC</h2>
    <div class="grid">
        <div class="group">
            <label>Precio "SOLO EJEMPLO: 85 HP MOTOR, DESCARGA LA APP PARA PRECIO ACTUAL DE TRACTOR " ($):</label>
            <input type="number" id="precio" value="850000">
        </div>
        <div class="group">
            <label>Enganche (%):</label>
            <input type="number" id="enganchePorc" value="20">
        </div>
        <div class="group">
            <label>Tasa Anual Base (%):</label>
            <input type="number" id="tasaBase" value="15" step="0.1">
        </div>
        <div class="group">
            <label>Plazo (Años):</label>
            <input type="number" id="plazo" value="5">
        </div>
        <div class="group">
            <label>Superficie Total (Hectáreas):</label>
            <input type="number" id="has" value="25">
        </div>
        <div class="group">
            <label>Flujo Neto Total del Cultivo ($):</label>
            <input type="number" id="flujoNeto" value="500000">
        </div>
        <div class="group">
            <label>Frecuencia de Pago:</label>
            <select id="frecuencia">
                <option value="12">Mensual</option>
                <option value="4">Trimestral</option>
                <option value="2">Semestral</option>
                <option value="1" selected>Anual</option>
            </select>
        </div>
        <div class="group">
            <label>Método de Amortización:</label>
            <select id="metodo">
                <option value="frances">Francés (Cuota Fija)</option>
                <option value="aleman">Alemán (Capital Fijo)</option>
            </select>
        </div>
        <div class="group">
            <label>IVA sobre Intereses (%):</label>
            <input type="number" id="ivaPorc" value="16">
        </div>
    </div>

    <button onclick="ejecutarSimulacionFase2()">Generar Dictamen y Tabla (Fase 2)</button>

    <div id="resultadoTexto" class="box">Los resultados detallados aparecerán aquí...</div>
    <div id="contenedorTablaAmortizacion" style="overflow-x:auto;"></div>
</div>

<script>
//aqui va el trabajador
async function ejecutarSimulacionFase2() {
    const btn = document.querySelector("button");
    const resBox = document.getElementById("resultadoTexto");
    const tblBox = document.getElementById("contenedorTablaAmortizacion");

    try {
        const payload = {
            precio: Number(document.getElementById("precio").value),
            enganchePorc: Number(document.getElementById("enganchePorc").value),
            tasaBase: Number(document.getElementById("tasaBase").value),
            plazo: Number(document.getElementById("plazo").value),
            has: Number(document.getElementById("has").value),
            flujoNeto: Number(document.getElementById("flujoNeto").value),
            frecuencia: Number(document.getElementById("frecuencia").value),
            ivaPorc: Number(document.getElementById("ivaPorc").value),
            metodo: document.getElementById("metodo").value
        };

        if (btn) btn.disabled = true;
        resBox.innerText = "Calculando en SiCredi Engine...";
//hyaku4kara Jsanarimashita
              
        if (!resp.ok || !data.exito) {
            resBox.innerText = "Error: " + (data.error || "Revisa los datos ingresados.");
            tblBox.innerHTML = "";
            return;
        }

        const r = data.resultados;
        const tabla = data.tablaAmortizacion || [];
        const formatoPesos = (val) =>
            (Number(val) || 0).toLocaleString("es-MX", { style: "currency", currency: "MXN" });

        let txt = `=== RESULTADOS DE SIMULACIÓN AVANZADA (FASE 2) ===\n`;
        txt += `Monto a Financiar: ${formatoPesos(r.montoFinanciar)} | Enganche: ${formatoPesos(r.enganche)}\n`;
        txt += `Método: ${payload.metodo === "frances" ? "FRANCÉS" : "ALEMÁN"} | Frecuencia: ${payload.frecuencia} pagos/año\n`;
        txt += `Total a Pagar con IVA: ${formatoPesos(r.totalPagar)} (Intereses: ${formatoPesos(r.totalIntereses)} | IVA: ${formatoPesos(r.totalIVA)})\n\n`;

        txt += `=== ANÁLISIS DE CAPACIDAD Y PUNTO DE EQUILIBRIO (BEP) ===\n`;
        txt += `Servicio Anual de Deuda + IVA (PRIMER AÑO): ${formatoPesos(r.servicioDeudaAnual)}\n`;
        txt += `DSCR Ajustado: ${Number(r.dscrAjustado).toFixed(2)} (Mínimo requerido: ${Number(r.dscrMinimo).toFixed(2)})\n`;
        txt += `Superficie Mínima considerando DSCR mínimo y 65% del flujo neto (BEP): ${r.bepHas === null ? "N/A" : Number(r.bepHas).toFixed(2) + " Ha."} necesarias para respaldar la deuda.\n\n`;

        if (r.dictamen === "SUJETO") {
            txt += `✓ DICTAMEN: SUJETO (CUMPLE EL CRITERIO DE CAPACIDAD DE PAGO)`;
        } else {
            txt += `⚠ DICTAMEN: NO SUJETO (CAPACIDAD DE PAGO INSUFICIENTE)`;
        }

        resBox.innerText = txt;

        let htmlTbl = `<h3>=== TABLA DE AMORTIZACIÓN DETALLADA ===</h3>`;
        htmlTbl += `<table><tr><th>Periodo</th><th>Pago Total</th><th>Interés</th><th>IVA Int.</th><th>Capital</th><th>Saldo</th></tr>`;
        tabla.forEach((fila) => {
            htmlTbl += `<tr>`;
            htmlTbl += `<td>${fila.numero}</td>`;
            htmlTbl += `<td>${formatoPesos(fila.pago)}</td>`;
            htmlTbl += `<td>${formatoPesos(fila.interes)}</td>`;
            htmlTbl += `<td>${formatoPesos(fila.iva)}</td>`;
            htmlTbl += `<td>${formatoPesos(fila.capital)}</td>`;
            htmlTbl += `<td>${formatoPesos(fila.saldoFinal)}</td>`;
            htmlTbl += `</tr>`;
        });
        htmlTbl += `</table>`;
        tblBox.innerHTML = htmlTbl;

    } catch (e) {
        resBox.innerText = "Error al conectar con el servidor: " + e.message;
    } finally {
        if (btn) btn.disabled = false;
    }
}
</script>

</body>
</html>
